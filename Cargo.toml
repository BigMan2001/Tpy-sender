[workspace]
resolver = "2"
members = [
    "crates/tpu-client",
]

[workspace.package]
authors = ["Triton One"]
edition = "2024"
homepage = "https://triton.one"
repository = "https://github.com/rpcpool/yellowstone-jet"
license = "Apache-2.0"
keywords = ["yellowstone", "solana", "rpc", "jet", "tpu", "triton"]
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = "1.5.7"
bs58 = "0.5.1"
bytes = "1.11.1"
clap = "4.5.51"
derive_more = "2.0.1"
dotenvy = "0.15.0"
futures = "0.3.31"
hostname = "0.4.1"
http-body-util = "0.1.3"
humantime-serde = "1.1.1"
hyper = "1.7.0"
lazy_static = "1.5.0"
maplit = "1.0.2"
pin-project = "1.1.5"
prometheus = "0.14.0"
quinn = "0.11.6"
quinn-proto = "0.11.6"
rand = "0.9.2"
retry = "2.1.0"
rustls = { version = "0.23.35", default-features = false }
semver = "1.0.22"
serde = "1.0.215"
serde_json = "1.0.116"
serde_yaml = "0.9.25"
thiserror = "2.0.17"
tokio = "1.48.0"
tokio-stream = "0.1.15"
tokio-util = "0.7.16"
tracing = "0.1.40"
tracing-subscriber = "0.3.1"

# Agave Monorepo
solana-bincode = "3.0.0"
solana-client = "3.0.0"
solana-net-utils = "3.0.0"
solana-rpc-client = "3.0.0"
solana-rpc-client-api = "3.0.0"
solana-streamer = "3.0.6"
solana-system-interface = "3.0.0"
solana-tls-utils = "3.0.0"
solana-version = "3.0.0"

# Solana SDK
solana-account = "3.0.0"
solana-clock = "3.0.0"
solana-commitment-config = "3.0.0"
solana-epoch-info = "3.0.0"
solana-hash = "3.0.0"
solana-instruction = "3.0.0"
solana-keypair = "3.0.0"
solana-message = "3.0.0"
solana-packet = "3.0.0"
solana-pubkey = "3.0.0"
solana-quic-definitions = "3.0.0"
solana-signature = "3.0.0"
solana-signer = "3.0.0"
solana-transaction = "3.0.0"
solana-transaction-error = "3.0.0"

# Yellowstone
yellowstone-grpc-client = "10.2.0"
yellowstone-grpc-proto = "10.1.1"
yellowstone-shield-store = "0.9.1"

[workspace.lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
codegen-units = 1
lto = true
